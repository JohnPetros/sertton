appId: br.com.sertton.sertton
---
- killApp
- openLink: "sertton://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible:
      id: "home-search-input"
    timeout: 90000
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 25%
          duration: 500
- tapOn:
    id: "home-newsletter-input"
- inputText: "maestro-newsletter@example.com"
- tapOn:
    id: "home-newsletter-submit"
- assertVisible: "Cadastro realizado com sucesso!"
