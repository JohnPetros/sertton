appId: br.com.sertton.sertton
---
- killApp
- openLink: "sertton://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible:
      id: "home-search-input"
    timeout: 90000
- tapOn:
    id: "home-search-input"
- inputText: "produto-inexistente-maestro"
- hideKeyboard
- tapOn:
    point: "90%, 12%"
- extendedWaitUntil:
    visible: "Categoria"
    timeout: 30000
- assertVisible: "Marcas"
- scrollUntilVisible:
    element: "Nenhum produto encontrado."
    direction: DOWN
- assertVisible: "Nenhum produto encontrado."
