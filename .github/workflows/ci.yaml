name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.x

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and boundaries
        run: npm run check:code

      - name: Typecheck
        run: npm run check:types

      - name: Run tests
        run: npm run test:coverage

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Configure local integration environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          YAMPI_API_URL=http://127.0.0.1:4010
          YAMPI_PURCHASE_URL=http://127.0.0.1:4010
          YAMPI_SECRET_KEY=mock-secret
          YAMPI_USER_TOKEN=mock-token
          EOF

      - name: Install Maestro
        shell: bash
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Generate Android project
        run: npx expo prebuild --no-install --clean --platform android

      - name: Build Android debug client
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Run Maestro integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081
            adb reverse tcp:4010 tcp:4010
            npm run mock:yampi > yampi-mock.log 2>&1 &
            npx expo start --dev-client --localhost > metro.log 2>&1 &
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:8081/status > /dev/null; then
                break
              fi
              sleep 2
            done
            curl --fail http://127.0.0.1:8081/status
            npm run test:integration

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            yampi-mock.log
            metro.log
            maestro-output
          if-no-files-found: ignore
