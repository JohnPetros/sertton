name: Android Continuous Deployment

on:
  workflow_call:
    secrets:
      EXPO_TOKEN:
        required: true

jobs:
  build-and-submit-to-google-play:
    name: Build and Submit to Google Play
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android production artifact
        run: eas build --platform android --non-interactive --wait

      - name: Submit latest Android build to Google Play
        run: eas submit --platform android --latest --non-interactive
